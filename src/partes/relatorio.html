<figure class="folha" aria-label="Exemplo de relatório de avaliação, com dados fictícios">
  <div class="folha-topo">
    <p class="folha-marca" translate="no">{{nome}}<span>{{profissao}}, {{{crefitoHtml}}}</span></p>
    <p class="folha-tipo">Relatório de avaliação funcional</p>
  </div>
  <dl class="folha-dados">
    <div><dt>Paciente</dt><dd>Exemplo</dd></div>
    <div><dt>Idade</dt><dd>78 anos</dd></div>
    <div><dt>Data</dt><dd>12/11/2026</dd></div>
  </dl>
  <table class="folha-tabela">
    <thead><tr><th scope="col">Teste</th><th scope="col">Resultado</th></tr></thead>
    <tbody>
      <tr><td>Força de preensão palmar</td><td>17 kg</td></tr>
      <tr><td>Sentar e levantar 5 vezes</td><td>16,4 s</td></tr>
      <tr><td>Velocidade de marcha</td><td>0,82 m/s</td></tr>
      <tr><td>Timed Up and Go</td><td>13,1 s</td></tr>
      <tr><td>SARC-F</td><td>4 de 10</td></tr>
      <tr><td>Fragilidade (Fried)</td><td>2 de 5</td></tr>
    </tbody>
  </table>
  <div class="folha-obs" aria-hidden="true">
    <p class="folha-obs-titulo">Pontos de atenção para a família</p>
    <span></span><span></span><span></span>
  </div>
  <figcaption class="folha-rodape">Exemplo ilustrativo com dados fictícios</figcaption>
</figure>
