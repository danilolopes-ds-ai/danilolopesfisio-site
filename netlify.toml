# O site já vai pronto em public/: o Netlify só publica, sem etapa de build.
[build]
  publish = "public"

[[redirects]]
  from = "/homecare"
  to = "/home-care/"
  status = 301

[[redirects]]
  from = "/avaliacao-fisioterapeutica"
  to = "/avaliacao/"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/fontes/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
