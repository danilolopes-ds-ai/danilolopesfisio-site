name: Verificar site

on:
  push:
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Gerar e conferir as páginas
        run: node build.mjs
      - name: Conferir se a pasta public enviada está igual à gerada
        run: git diff --exit-code -- public
